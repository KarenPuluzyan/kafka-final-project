#cloud-config
# ============================================================
# cloud-init для прерываемой VM 16 vCPU / 64 ГБ
# Полностью автоматическая инициализация без участия человека
# ============================================================

users:
  - name: ubuntu
    groups: [sudo, docker]
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - ${ssh_public_key}

package_update: true
package_upgrade: false   # не обновляем все пакеты — экономим время

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - git
  - htop
  - ncdu
  - unzip
  - openssl
  - default-jdk
  - python3-pip
  - python3-venv
  - jq
  - net-tools
  - bc

write_files:
  - path: /etc/security/limits.d/kafka.conf
    content: |
      ubuntu soft nofile 1048576
      ubuntu hard nofile 1048576
      root   soft nofile 1048576
      root   hard nofile 1048576

  - path: /etc/sysctl.d/99-kafka.conf
    content: |
      vm.swappiness=1
      vm.dirty_ratio=80
      vm.dirty_background_ratio=5
      net.core.somaxconn=65535
      net.ipv4.tcp_max_syn_backlog=65535
      fs.file-max=2000000

  # Скрипт статуса — запускается при каждом входе по SSH
  - path: /etc/profile.d/kafka-status.sh
    content: |
      if [ -f /home/ubuntu/kafka-project/docker-compose.yml ]; then
        PUBLIC_IP=$(curl -s --max-time 2 http://169.254.169.254/latest/meta-data/public-ipv4 2>/dev/null || echo "N/A")
        echo ""
        echo "  ╔══════════════════════════════════════════════════════╗"
        echo "  ║   Аналитическая платформа «Покупай выгодно»          ║"
        echo "  ╠══════════════════════════════════════════════════════╣"
        echo "  ║  Kafka UI ЦОД-1: http://$PUBLIC_IP:8080      ║"
        echo "  ║  Kafka UI ЦОД-2: http://$PUBLIC_IP:8081      ║"
        echo "  ║  Grafana:        http://$PUBLIC_IP:3000       ║"
        echo "  ║  Prometheus:     http://$PUBLIC_IP:9090       ║"
        echo "  ╠══════════════════════════════════════════════════════╣"
        echo "  ║  Команды:                                            ║"
        echo "  ║   docker compose ps           — статус              ║"
        echo "  ║   docker compose logs -f      — логи                ║"
        echo "  ║   bash scripts/collect-report.sh — сбор отчёта      ║"
        echo "  ╚══════════════════════════════════════════════════════╝"
        echo ""
      fi

runcmd:
  - sysctl --system

  # ── Docker ──────────────────────────────────────────────
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - |
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] \
    https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" \
    > /etc/apt/sources.list.d/docker.list
  - apt-get update -qq
  - apt-get install -y -qq docker-ce docker-ce-cli containerd.io docker-compose-plugin
  - systemctl enable docker && systemctl start docker
  - usermod -aG docker ubuntu

  # ── Проект копируется по scp после создания VM ──────────
  - mkdir -p /home/ubuntu/kafka-project
  - chown -R ubuntu:ubuntu /home/ubuntu/kafka-project
  
