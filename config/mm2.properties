# ============================================================
# MirrorMaker 2 — репликация между двумя ЦОД
#
# ЦОД-1 (Москва)          → ЦОД-2 (Санкт-Петербург)
# kafka-1/2/3 (основной)  → kafka-4/5/6 (аналитический)
#
# MirrorMaker2 работает в backbone-net и видит оба кластера
# через EXTERNAL-листенеры брокеров, также подключённых к backbone-net.
#
# Алиас "dc1" → kafka-1:29092 (EXTERNAL-порт, доступен в backbone-net)
# Алиас "dc2" → kafka-4:39092 (INTERNAL-порт, доступен в backbone-net)
# ============================================================

# Два кластера с псевдонимами
clusters = dc1, dc2

# ─── Кластер ЦОД-1 (источник) ────────────────────────────
# EXTERNAL листенеры kafka-1/2/3 доступны из backbone-net
dc1.bootstrap.servers = kafka-1:29092,kafka-2:29094,kafka-3:29096

# ─── Кластер ЦОД-2 (назначение) ──────────────────────────
# INTERNAL листенеры kafka-4/5/6 доступны из backbone-net
dc2.bootstrap.servers = kafka-4:39092,kafka-5:39094,kafka-6:39096

# ─── Направление репликации: dc1 → dc2 ───────────────────
dc1->dc2.enabled = true

# Реплицируем только нужные топики
dc1->dc2.topics = products-filtered, client-requests, analytics-events

# Consumer-группы реплицировать не нужно
dc1->dc2.groups = ''

# Отключаем синхронизацию ACL (у dc2 нет SSL, конфликт)
dc1->dc2.sync.topic.acls.enabled = false

# Синхронизация конфигурации топиков
dc1->dc2.sync.topic.configs.enabled = true

# ─── Обратная репликация не нужна ────────────────────────
dc2->dc1.enabled = false

# ─── Технические параметры ───────────────────────────────
# Replication factor для служебных топиков MM2 в ЦОД-2
replication.factor = 3

# Служебные топики MirrorMaker2 в ЦОД-2
checkpoints.topic.replication.factor = 3
heartbeats.topic.replication.factor = 3
offset-syncs.topic.replication.factor = 3

# Как часто проверять новые топики
refresh.topics.interval.seconds = 30
refresh.groups.interval.seconds = 30

# Heartbeat
emit.heartbeats.interval.seconds = 5
emit.checkpoints.interval.seconds = 60

# Префикс для реплицированных топиков: dc1.products-filtered
# (именно эти имена создали в init-topics-dc2.sh)
