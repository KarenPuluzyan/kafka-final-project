# ============================================================
# JMX Exporter — правила экспорта метрик Kafka
# Использует опыт из Kafka_Yandex_Block4
# ============================================================

startDelaySeconds: 0
ssl: false
lowercaseOutputName: false
lowercaseOutputLabelNames: false

rules:
  # ─── Kafka Server метрики ─────────────────────────────
  - pattern: "kafka.server<type=(.+), name=(.+), clientId=(.+), topic=(.+), partition=(.*)><>Value"
    name: "kafka_server_$1_$2"
    type: GAUGE
    labels:
      clientId: "$3"
      topic: "$4"
      partition: "$5"

  - pattern: "kafka.server<type=(.+), name=(.+), clientId=(.+), brokerHost=(.+), brokerPort=(.+)><>Value"
    name: "kafka_server_$1_$2"
    type: GAUGE
    labels:
      clientId: "$3"
      broker: "$4:$5"

  - pattern: "kafka.server<type=(.+), name=(.+)><>OneMinuteRate"
    name: "kafka_server_$1_$2_rate1m"
    type: GAUGE

  - pattern: "kafka.server<type=(.+), name=(.+)><>Value"
    name: "kafka_server_$1_$2"
    type: GAUGE

  - pattern: "kafka.server<type=(.+), name=(.+)><>Count"
    name: "kafka_server_$1_$2_count"
    type: COUNTER

  # ─── Kafka Network метрики ────────────────────────────
  - pattern: "kafka.network<type=(.+), name=(.+), request=(.+)><>OneMinuteRate"
    name: "kafka_network_$1_$2_rate1m"
    type: GAUGE
    labels:
      request: "$3"

  - pattern: "kafka.network<type=(.+), name=(.+)><>Value"
    name: "kafka_network_$1_$2"
    type: GAUGE

  # ─── Kafka Log метрики ────────────────────────────────
  - pattern: "kafka.log<type=(.+), name=(.+), topic=(.+), partition=(.+)><>Value"
    name: "kafka_log_$1_$2"
    type: GAUGE
    labels:
      topic: "$3"
      partition: "$4"

  # ─── JVM метрики ──────────────────────────────────────
  - pattern: "java.lang<type=GarbageCollector, name=(.+)><>CollectionCount"
    name: "jvm_gc_collection_count"
    type: COUNTER
    labels:
      gc: "$1"

  - pattern: "java.lang<type=GarbageCollector, name=(.+)><>CollectionTime"
    name: "jvm_gc_collection_time_ms"
    type: COUNTER
    labels:
      gc: "$1"

  - pattern: "java.lang<type=Memory><>HeapMemoryUsage.used"
    name: "jvm_heap_memory_used_bytes"
    type: GAUGE

  - pattern: "java.lang<type=Memory><>HeapMemoryUsage.max"
    name: "jvm_heap_memory_max_bytes"
    type: GAUGE
