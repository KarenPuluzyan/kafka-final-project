version: '3.8'

# ╔══════════════════════════════════════════════════════════════╗
# ║  «Покупай выгодно» — Финальный проект                        ║
# ║  VM: 16 vCPU / 64 ГБ RAM / 100 ГБ SSD (прерываемая, 1 день)║
# ║                                                              ║
# ║  Heap JVM не ограничен — полные production-размеры:         ║
# ║    ZooKeeper  -Xmx512m                                      ║
# ║    Kafka      -Xmx2g   (стандарт)                          ║
# ║    Connect    -Xmx1g                                        ║
# ║    MirrorMaker -Xmx768m                                     ║
# ║                                                              ║
# ║  Retention log: ЦОД-1 1 ч, ЦОД-2 2 ч                       ║
# ╚══════════════════════════════════════════════════════════════╝

networks:
  dc1-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
  dc2-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/24
  backbone-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/24

volumes:
  prometheus_data:
  grafana_data:
  zk1-1-data:
  zk1-2-data:
  zk1-3-data:
  zk2-1-data:
  zk2-2-data:
  zk2-3-data:
  kafka1-1-data:
  kafka1-2-data:
  kafka1-3-data:
  kafka2-1-data:
  kafka2-2-data:
  kafka2-3-data:

services:

# ════════════════════════════════════════════════════════════
#  ЦОД-1 — МОСКВА  (dc1-net)
# ════════════════════════════════════════════════════════════

  zk1-1:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zk1-1
    hostname: zk1-1
    networks: [dc1-net]
    volumes: [zk1-1-data:/var/lib/zookeeper/data]
    environment:
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVERS: "zk1-1:2888:3888;zk1-2:2888:3888;zk1-3:2888:3888"
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo srvr | nc localhost 2181 | grep Mode"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  zk1-2:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zk1-2
    hostname: zk1-2
    networks: [dc1-net]
    volumes: [zk1-2-data:/var/lib/zookeeper/data]
    environment:
      ZOOKEEPER_SERVER_ID: 2
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVERS: "zk1-1:2888:3888;zk1-2:2888:3888;zk1-3:2888:3888"
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo srvr | nc localhost 2181 | grep Mode"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  zk1-3:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zk1-3
    hostname: zk1-3
    networks: [dc1-net]
    volumes: [zk1-3-data:/var/lib/zookeeper/data]
    environment:
      ZOOKEEPER_SERVER_ID: 3
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVERS: "zk1-1:2888:3888;zk1-2:2888:3888;zk1-3:2888:3888"
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo srvr | nc localhost 2181 | grep Mode"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  kafka-1:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-1
    hostname: kafka-1
    networks: [dc1-net, backbone-net]
    ports:
      - "19092:19092"
      - "19093:19093"
    depends_on:
      zk1-1: {condition: service_healthy}
      zk1-2: {condition: service_healthy}
      zk1-3: {condition: service_healthy}
    volumes:
      - kafka1-1-data:/var/lib/kafka/data
      - ./ssl/dc1:/etc/kafka/secrets:ro
      - ./config/jmx-exporter.yml:/etc/kafka/jmx-exporter.yml:ro
      - ./jmx_prometheus_javaagent-0.20.0.jar:/opt/jmx_exporter/jmx_prometheus_javaagent.jar:ro
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zk1-1:2181,zk1-2:2181,zk1-3:2181/kafka-dc1"
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:29092,SSL://0.0.0.0:9093,EXTERNAL://0.0.0.0:19092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-1:29092,SSL://kafka-1:9093,EXTERNAL://localhost:19092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,SSL:SSL,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_SSL_KEYSTORE_FILENAME: kafka-1.keystore.jks
      KAFKA_SSL_KEYSTORE_CREDENTIALS: ssl_credentials
      KAFKA_SSL_KEY_CREDENTIALS: ssl_credentials
      KAFKA_SSL_TRUSTSTORE_FILENAME: kafka.truststore.jks
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: ssl_credentials
      KAFKA_SSL_CLIENT_AUTH: required
      KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: ""
      KAFKA_AUTHORIZER_CLASS_NAME: kafka.security.authorizer.AclAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "true"
      KAFKA_SUPER_USERS: User:ANONYMOUS
      KAFKA_HEAP_OPTS: "-Xmx2g -Xms1g"
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: kafka-1
      KAFKA_OPTS: "-javaagent:/opt/jmx_exporter/jmx_prometheus_javaagent.jar=7071:/etc/kafka/jmx-exporter.yml"
      KAFKA_LOG_RETENTION_HOURS: 1
      KAFKA_LOG_SEGMENT_BYTES: 536870912
    healthcheck:
      test: ["CMD", "bash", "-c", "KAFKA_OPTS= kafka-topics --bootstrap-server localhost:29092 --list"]
      interval: 20s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  kafka-2:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-2
    hostname: kafka-2
    networks: [dc1-net, backbone-net]
    ports:
      - "19094:19094"
      - "19095:19095"
    depends_on:
      zk1-1: {condition: service_healthy}
      zk1-2: {condition: service_healthy}
      zk1-3: {condition: service_healthy}
    volumes:
      - kafka1-2-data:/var/lib/kafka/data
      - ./ssl/dc1:/etc/kafka/secrets:ro
      - ./config/jmx-exporter.yml:/etc/kafka/jmx-exporter.yml:ro
      - ./jmx_prometheus_javaagent-0.20.0.jar:/opt/jmx_exporter/jmx_prometheus_javaagent.jar:ro
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: "zk1-1:2181,zk1-2:2181,zk1-3:2181/kafka-dc1"
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:29094,SSL://0.0.0.0:9095,EXTERNAL://0.0.0.0:19094"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-2:29094,SSL://kafka-2:9095,EXTERNAL://localhost:19094"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,SSL:SSL,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_SSL_KEYSTORE_FILENAME: kafka-2.keystore.jks
      KAFKA_SSL_KEYSTORE_CREDENTIALS: ssl_credentials
      KAFKA_SSL_KEY_CREDENTIALS: ssl_credentials
      KAFKA_SSL_TRUSTSTORE_FILENAME: kafka.truststore.jks
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: ssl_credentials
      KAFKA_SSL_CLIENT_AUTH: required
      KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: ""
      KAFKA_AUTHORIZER_CLASS_NAME: kafka.security.authorizer.AclAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "true"
      KAFKA_SUPER_USERS: User:ANONYMOUS
      KAFKA_HEAP_OPTS: "-Xmx2g -Xms1g"
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: kafka-2
      KAFKA_OPTS: "-javaagent:/opt/jmx_exporter/jmx_prometheus_javaagent.jar=7071:/etc/kafka/jmx-exporter.yml"
      KAFKA_LOG_RETENTION_HOURS: 1
      KAFKA_LOG_SEGMENT_BYTES: 536870912
    healthcheck:
      test: ["CMD", "bash", "-c", "KAFKA_OPTS= kafka-topics --bootstrap-server localhost:29094 --list"]
      interval: 20s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  kafka-3:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-3
    hostname: kafka-3
    networks: [dc1-net, backbone-net]
    ports:
      - "19096:19096"
      - "19097:19097"
    depends_on:
      zk1-1: {condition: service_healthy}
      zk1-2: {condition: service_healthy}
      zk1-3: {condition: service_healthy}
    volumes:
      - kafka1-3-data:/var/lib/kafka/data
      - ./ssl/dc1:/etc/kafka/secrets:ro
      - ./config/jmx-exporter.yml:/etc/kafka/jmx-exporter.yml:ro
      - ./jmx_prometheus_javaagent-0.20.0.jar:/opt/jmx_exporter/jmx_prometheus_javaagent.jar:ro
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: "zk1-1:2181,zk1-2:2181,zk1-3:2181/kafka-dc1"
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:29096,SSL://0.0.0.0:9097,EXTERNAL://0.0.0.0:19096"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-3:29096,SSL://kafka-3:9097,EXTERNAL://localhost:19096"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,SSL:SSL,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_SSL_KEYSTORE_FILENAME: kafka-3.keystore.jks
      KAFKA_SSL_KEYSTORE_CREDENTIALS: ssl_credentials
      KAFKA_SSL_KEY_CREDENTIALS: ssl_credentials
      KAFKA_SSL_TRUSTSTORE_FILENAME: kafka.truststore.jks
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: ssl_credentials
      KAFKA_SSL_CLIENT_AUTH: required
      KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: ""
      KAFKA_AUTHORIZER_CLASS_NAME: kafka.security.authorizer.AclAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "true"
      KAFKA_SUPER_USERS: User:ANONYMOUS
      KAFKA_HEAP_OPTS: "-Xmx2g -Xms1g"
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: kafka-3
      KAFKA_OPTS: "-javaagent:/opt/jmx_exporter/jmx_prometheus_javaagent.jar=7071:/etc/kafka/jmx-exporter.yml"
      KAFKA_LOG_RETENTION_HOURS: 1
      KAFKA_LOG_SEGMENT_BYTES: 536870912
    healthcheck:
      test: ["CMD", "bash", "-c", "KAFKA_OPTS= kafka-topics --bootstrap-server localhost:29096 --list"]
      interval: 20s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  kafka-init-dc1:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-init-dc1
    networks: [dc1-net]
    depends_on:
      kafka-1: {condition: service_healthy}
      kafka-2: {condition: service_healthy}
      kafka-3: {condition: service_healthy}
    volumes: [./scripts/init-topics-dc1.sh:/init-topics.sh:ro]
    command: bash /init-topics.sh
    restart: on-failure

  kafka-connect:
    image: confluentinc/cp-kafka-connect:7.5.0
    container_name: kafka-connect
    hostname: kafka-connect
    networks: [dc1-net]
    ports: ["8083:8083"]
    depends_on:
      kafka-init-dc1: {condition: service_completed_successfully}
    volumes: [./data:/data]
    environment:
      CONNECT_BOOTSTRAP_SERVERS: "kafka-1:29092,kafka-2:29094,kafka-3:29096"
      CONNECT_REST_PORT: 8083
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_GROUP_ID: connect-group-dc1
      CONNECT_CONFIG_STORAGE_TOPIC: _connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: _connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: _connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
      KAFKA_HEAP_OPTS: "-Xmx1g -Xms512m"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8083/"]
      interval: 20s
      timeout: 10s
      retries: 15
    restart: unless-stopped

  faust-filter:
    build: {context: ./services/faust-filter, dockerfile: Dockerfile}
    container_name: faust-filter
    hostname: faust-filter
    networks: [dc1-net]
    ports: ["6066:6066"]
    depends_on:
      kafka-init-dc1: {condition: service_completed_successfully}
    environment:
      KAFKA_BROKERS: "kafka-1:29092,kafka-2:29094,kafka-3:29096"
    restart: unless-stopped

  shop-api:
    build: {context: ./services/shop-api, dockerfile: Dockerfile}
    container_name: shop-api
    hostname: shop-api
    networks: [dc1-net]
    depends_on:
      kafka-init-dc1: {condition: service_completed_successfully}
    volumes: [./data/products.json:/app/products.json:ro]
    environment:
      KAFKA_BROKERS: "kafka-1:29092,kafka-2:29094,kafka-3:29096"
      SEND_INTERVAL: "10"
    restart: on-failure

  kafka-ui-dc1:
    image: provectuslabs/kafka-ui:v0.7.0
    container_name: kafka-ui-dc1
    networks: [dc1-net]
    ports: ["8080:8080"]
    depends_on:
      kafka-init-dc1: {condition: service_completed_successfully}
    environment:
      KAFKA_CLUSTERS_0_NAME: "DC1-Moscow (основной)"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka-1:29092,kafka-2:29094,kafka-3:29096"
      KAFKA_CLUSTERS_0_ZOOKEEPER: "zk1-1:2181,zk1-2:2181,zk1-3:2181"
      JAVA_OPTS: "-Xmx512m"
    restart: unless-stopped

# ════════════════════════════════════════════════════════════
#  ЦОД-2 — САНКТ-ПЕТЕРБУРГ  (dc2-net)
