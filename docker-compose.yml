      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: kafka-5
      KAFKA_OPTS: "-javaagent:/opt/jmx_exporter/jmx_prometheus_javaagent.jar=7071:/etc/kafka/jmx-exporter.yml"
      KAFKA_LOG_RETENTION_HOURS: 2
    healthcheck:
      test: ["CMD", "bash", "-c", "KAFKA_OPTS= kafka-topics --bootstrap-server localhost:39094 --list"]
      interval: 20s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  kafka-6:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-6
    hostname: kafka-6
    networks: [dc2-net, backbone-net]
    ports: ["29096:29096"]
    depends_on:
      zk2-1: {condition: service_healthy}
      zk2-2: {condition: service_healthy}
      zk2-3: {condition: service_healthy}
    volumes:
      - kafka2-3-data:/var/lib/kafka/data
      - ./config/jmx-exporter.yml:/etc/kafka/jmx-exporter.yml:ro
      - ./jmx_prometheus_javaagent-0.20.0.jar:/opt/jmx_exporter/jmx_prometheus_javaagent.jar:ro
    environment:
      KAFKA_BROKER_ID: 6
      KAFKA_ZOOKEEPER_CONNECT: "zk2-1:2181,zk2-2:2181,zk2-3:2181/kafka-dc2"
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:39096,EXTERNAL://0.0.0.0:29096"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-6:39096,EXTERNAL://localhost:29096"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx2g -Xms1g"
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: kafka-6
      KAFKA_OPTS: "-javaagent:/opt/jmx_exporter/jmx_prometheus_javaagent.jar=7071:/etc/kafka/jmx-exporter.yml"
      KAFKA_LOG_RETENTION_HOURS: 2
    healthcheck:
      test: ["CMD", "bash", "-c", "KAFKA_OPTS= kafka-topics --bootstrap-server localhost:39096 --list"]
      interval: 20s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  kafka-init-dc2:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-init-dc2
    networks: [dc2-net]
    depends_on:
      kafka-4: {condition: service_healthy}
      kafka-5: {condition: service_healthy}
      kafka-6: {condition: service_healthy}
    volumes: [./scripts/init-topics-dc2.sh:/init-topics.sh:ro]
    command: bash /init-topics.sh
    restart: on-failure

  analytics:
    build: {context: ./services/analytics, dockerfile: Dockerfile}
    container_name: analytics
    hostname: analytics
    networks: [dc2-net, backbone-net]
    depends_on:
      kafka-init-dc2: {condition: service_completed_successfully}
    environment:
      KAFKA_BROKERS_DC2: "kafka-4:39092,kafka-5:39094,kafka-6:39096"
      KAFKA_BROKERS_DC1: "kafka-1:29092,kafka-2:29094,kafka-3:29096"
      ANALYTICS_WINDOW: "30"
    restart: unless-stopped

  kafka-ui-dc2:
    image: provectuslabs/kafka-ui:v0.7.0
    container_name: kafka-ui-dc2
    networks: [dc2-net]
    ports: ["8081:8080"]
    depends_on:
      kafka-init-dc2: {condition: service_completed_successfully}
    environment:
      KAFKA_CLUSTERS_0_NAME: "DC2-SPb (аналитический)"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka-4:39092,kafka-5:39094,kafka-6:39096"
      KAFKA_CLUSTERS_0_ZOOKEEPER: "zk2-1:2181,zk2-2:2181,zk2-3:2181"
      JAVA_OPTS: "-Xmx512m"
    restart: unless-stopped

# ════════════════════════════════════════════════════════════
#  МЕЖЦОДОВЫЙ КАНАЛ (backbone-net)
# ════════════════════════════════════════════════════════════

  mirrormaker2:
    image: confluentinc/cp-kafka:7.5.0
    container_name: mirrormaker2
    hostname: mirrormaker2
    networks: [backbone-net]
    depends_on:
      kafka-init-dc1: {condition: service_completed_successfully}
      kafka-init-dc2: {condition: service_completed_successfully}
    volumes: [./config/mm2.properties:/etc/kafka/mm2.properties:ro]
    environment:
      KAFKA_HEAP_OPTS: "-Xmx768m -Xms384m"
    command: >
      bash -c "
        echo '⏳ Ожидаем стабилизации кластеров (45 сек)...';
        sleep 45;
        echo '🔄 Запускаем MirrorMaker2 DC1→DC2...';
        /usr/bin/connect-mirror-maker /etc/kafka/mm2.properties
      "
    restart: on-failure

# ════════════════════════════════════════════════════════════
#  МОНИТОРИНГ (backbone-net — видит оба кластера)
# ════════════════════════════════════════════════════════════

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: prometheus
    hostname: prometheus
    networks: [backbone-net]
    ports: ["9090:9090"]
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=2d'
      - '--web.enable-lifecycle'
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: alertmanager
    hostname: alertmanager
    networks: [backbone-net]
    ports: ["9093:9093"]
    volumes: [./config/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro]
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.0
    container_name: grafana
    hostname: grafana
    networks: [backbone-net]
    ports: ["3000:3000"]
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on: [prometheus]
    restart: unless-stopped
