# ============================================================
# Alertmanager — конфигурация оповещений
# Шаг 6 финального проекта
# ============================================================

global:
  resolve_timeout: 5m
  # Для Telegram-уведомлений (опционально):
  # telegram_api_url: 'https://api.telegram.org'

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
  receiver: 'default'

  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 10s
      repeat_interval: 30m

receivers:
  - name: 'default'
    # Для email (настройте под свои данные):
    # email_configs:
    #   - to: 'admin@marketplace.ru'
    #     from: 'alertmanager@marketplace.ru'
    #     smarthost: 'smtp.example.com:587'
    #     auth_username: 'user'
    #     auth_password: 'pass'

    # Для Telegram (опционально):
    # telegram_configs:
    #   - api_url: 'https://api.telegram.org'
    #     bot_token: 'YOUR_BOT_TOKEN'
    #     chat_id: YOUR_CHAT_ID
    #     message: '{{ range .Alerts }}{{ .Annotations.summary }}: {{ .Annotations.description }}{{ end }}'

    # По умолчанию — webhook (можно настроить на любой эндпоинт)
    webhook_configs:
      - url: 'http://localhost:5001/alerts'
        send_resolved: true

  - name: 'critical-alerts'
    webhook_configs:
      - url: 'http://localhost:5001/alerts/critical'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']
